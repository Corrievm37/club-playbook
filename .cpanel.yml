---
deployment:
  tasks:
    # Repository is at /home/kuberdxi/public_html/playbook
    - export REPO_DIR="$HOME/public_html/playbook"
    # Copy bridge files to root (these bootstrap Laravel from the repo directory)
    - /bin/cp -f "$REPO_DIR/deploy/public_html_playbook/index.php" "$REPO_DIR/index.php"
    - /bin/cp -f "$REPO_DIR/deploy/public_html_playbook/.htaccess" "$REPO_DIR/.htaccess"
    # Ensure storage directories exist
    - mkdir -p "$REPO_DIR/storage/app/public/uploads/club_logos"
    - mkdir -p "$REPO_DIR/storage/framework/cache"
    - mkdir -p "$REPO_DIR/storage/framework/sessions"
    - mkdir -p "$REPO_DIR/storage/framework/views"
    - mkdir -p "$REPO_DIR/storage/logs"
    - mkdir -p "$REPO_DIR/bootstrap/cache"
    # Set permissions
    - chmod -R 775 "$REPO_DIR/storage" || true
    - chmod -R 775 "$REPO_DIR/bootstrap/cache" || true
