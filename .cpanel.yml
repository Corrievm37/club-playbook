---
deployment:
  tasks:
    # Repository is at /home/kuberdxi/public_html/playbook (Laravel app directly in web dir)
    - export REPO_DIR="$HOME/public_html/playbook"
    # Ensure storage directories exist
    - mkdir -p "$REPO_DIR/storage/app/public/uploads/club_logos"
    - mkdir -p "$REPO_DIR/storage/framework/cache"
    - mkdir -p "$REPO_DIR/storage/framework/sessions"
    - mkdir -p "$REPO_DIR/storage/framework/views"
    - mkdir -p "$REPO_DIR/storage/logs"
    - mkdir -p "$REPO_DIR/bootstrap/cache"
    # Set permissions
    - chmod -R 775 "$REPO_DIR/storage" || true
    - chmod -R 775 "$REPO_DIR/bootstrap/cache" || true
    # Copy public assets to web-accessible location (Vite builds to public/build, copy to playbook root)
    - |
        if [ -d "$REPO_DIR/public/build" ]; then
          mkdir -p "$REPO_DIR/build"
          /bin/cp -R "$REPO_DIR/public/build/." "$REPO_DIR/build/"
        fi
    # Copy public images to web-accessible location
    - |
        if [ -d "$REPO_DIR/public/images" ]; then
          mkdir -p "$REPO_DIR/images"
          /bin/cp -R "$REPO_DIR/public/images/." "$REPO_DIR/images/"
        fi
    # Create .htaccess in playbook root to route everything to public/index.php
    - |
        cat > "$REPO_DIR/.htaccess" << 'EOF'
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^(.*)$ public/$1 [L]
        </IfModule>
        EOF
