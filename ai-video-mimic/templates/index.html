<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Mimicking Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .upload-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 15px;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .file-input-label.has-file {
            background: #e7f3ff;
            border-color: #667eea;
            border-style: solid;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .status-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .status-message {
            text-align: center;
            color: #555;
            margin-bottom: 10px;
        }

        .download-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }

        .download-btn.active {
            display: block;
        }

        .download-btn:hover {
            background: #218838;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 AI Video Mimicking</h1>
        <p class="subtitle">Make any photo sing with AI-powered lip-sync</p>

        <div class="upload-section">
            <label>📸 Upload Photo</label>
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" accept="image/*">
                <label for="imageInput" class="file-input-label" id="imageLabel">
                    <div class="icon">🖼️</div>
                    <div>Click to upload image</div>
                    <small style="color: #999;">JPG, PNG, or GIF</small>
                </label>
            </div>
        </div>

        <div class="upload-section">
            <label>🎵 Upload Audio</label>
            <div class="file-input-wrapper">
                <input type="file" id="audioInput" accept="audio/*">
                <label for="audioInput" class="file-input-label" id="audioLabel">
                    <div class="icon">🎤</div>
                    <div>Click to upload audio</div>
                    <small style="color: #999;">MP3, WAV, or M4A</small>
                </label>
            </div>
        </div>

        <div class="options">
            <div>
                <label>Quality</label>
                <select id="quality">
                    <option value="low">Low (480p)</option>
                    <option value="medium" selected>Medium (720p)</option>
                    <option value="high">High (1080p)</option>
                </select>
            </div>
            <div>
                <label>Frame Rate</label>
                <select id="fps">
                    <option value="24">24 FPS</option>
                    <option value="25" selected>25 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn" disabled>Generate Video</button>

        <div class="status-section" id="statusSection">
            <div class="status-message" id="statusMessage">Processing...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <button class="download-btn" id="downloadBtn">Download Video</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        let currentJobId = null;
        let statusCheckInterval = null;

        const imageInput = document.getElementById('imageInput');
        const audioInput = document.getElementById('audioInput');
        const imageLabel = document.getElementById('imageLabel');
        const audioLabel = document.getElementById('audioLabel');
        const generateBtn = document.getElementById('generateBtn');
        const statusSection = document.getElementById('statusSection');
        const statusMessage = document.getElementById('statusMessage');
        const progressFill = document.getElementById('progressFill');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');

        imageInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                imageLabel.classList.add('has-file');
                imageLabel.innerHTML = `<div class="icon">✅</div><div>${e.target.files[0].name}</div>`;
                checkInputs();
            }
        });

        audioInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                audioLabel.classList.add('has-file');
                audioLabel.innerHTML = `<div class="icon">✅</div><div>${e.target.files[0].name}</div>`;
                checkInputs();
            }
        });

        function checkInputs() {
            if (imageInput.files.length > 0 && audioInput.files.length > 0) {
                generateBtn.disabled = false;
            }
        }

        generateBtn.addEventListener('click', async function() {
            const formData = new FormData();
            formData.append('image', imageInput.files[0]);
            formData.append('audio', audioInput.files[0]);
            formData.append('quality', document.getElementById('quality').value);
            formData.append('fps', document.getElementById('fps').value);

            generateBtn.disabled = true;
            errorMessage.classList.remove('active');
            statusSection.classList.add('active');
            downloadBtn.classList.remove('active');
            statusMessage.textContent = 'Uploading files...';
            progressFill.style.width = '0%';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    currentJobId = data.job_id;
                    startStatusCheck();
                } else {
                    showError(data.error || 'Upload failed');
                    generateBtn.disabled = false;
                }
            } catch (error) {
                showError('Network error: ' + error.message);
                generateBtn.disabled = false;
            }
        });

        function startStatusCheck() {
            statusCheckInterval = setInterval(checkStatus, 2000);
        }

        async function checkStatus() {
            try {
                const response = await fetch(`/status/${currentJobId}`);
                const data = await response.json();

                statusMessage.textContent = data.message;
                progressFill.style.width = data.progress + '%';

                if (data.status === 'completed') {
                    clearInterval(statusCheckInterval);
                    downloadBtn.classList.add('active');
                    generateBtn.disabled = false;
                } else if (data.status === 'failed') {
                    clearInterval(statusCheckInterval);
                    showError(data.message);
                    generateBtn.disabled = false;
                }
            } catch (error) {
                console.error('Status check error:', error);
            }
        }

        downloadBtn.addEventListener('click', function() {
            window.location.href = `/download/${currentJobId}`;
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            statusSection.classList.remove('active');
        }
    </script>
</body>
</html>
